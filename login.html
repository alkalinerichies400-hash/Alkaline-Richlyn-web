<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Alkaline Richlyn.org</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: gold;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: black;
      padding: 30px;
      border: 1px solid gold;
      border-radius: 10px;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: gold;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    a {
      color: gold;
      display: block;
      text-align: center;
      margin-top: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Login</h2>

  <form>
    <input type="text" placeholder="Username" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <a href="index.html">Back to Home</a>
</div>

</body>
</html>
